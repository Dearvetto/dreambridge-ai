<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DreamBridge AI | Parent</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1 id="welcome">Loading...</h1>
    <p>Your child's dreams (coming Day 4)</p>
    <button id="logout-btn">Log out</button>
  </main>
  <script type="module">
    import { requireRole, logout } from "./js/session.js";
    requireRole("parent", (user, profile) => {
      document.getElementById("welcome").textContent = "Hi " + profile.name + "!";
    });
    document.getElementById("logout-btn").addEventListener("click", logout);
  </script>
</body>
</html>
